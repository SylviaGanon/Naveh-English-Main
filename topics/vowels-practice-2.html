<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nave's CVC Vowel Explorer 🔤</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            touch-action: manipulation;
        }
        .font-fredoka {
            font-family: 'Fredoka', sans-serif;
        }
        .vowel-btn {
            transition: all 0.15s ease-in-out;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .vowel-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px rgba(0,0,0,0.15);
        }
        .vowel-btn.selected {
            transform: translateY(2px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.2);
        }
        .img-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 md:p-6 text-slate-800">

    <!-- Back Navigation Bar -->
    <div class="w-full max-w-2xl flex justify-start mb-2" dir="rtl">
        <a href="index.html" class="inline-flex items-center gap-1 text-sky-700 font-bold bg-white px-3 py-1.5 rounded-xl border border-sky-200 shadow-sm hover:bg-sky-50 transition text-sm">
            ➡️ חזרה למרכז
        </a>
    </div>

    <!-- Header Section -->
    <header class="w-full max-w-2xl text-center mb-3">
        <div class="flex items-center justify-between bg-white px-4 py-2 rounded-2xl shadow-sm border border-sky-200 mb-2">
            <span class="text-xs md:text-sm font-bold text-sky-700 bg-sky-100 px-3 py-1 rounded-full">
                Vowel Explorer: Try A, E, I, O, U!
            </span>
            <div class="flex items-center gap-1 text-xs md:text-sm font-bold text-slate-600">
                <span>🔊 Speed:</span>
                <button onclick="setSpeed(0.6)" id="speedSlow" class="px-2 py-0.5 rounded border border-slate-300 hover:bg-slate-100">Slow</button>
                <button onclick="setSpeed(0.85)" id="speedNorm" class="px-2 py-0.5 rounded bg-sky-500 text-white font-bold">Normal</button>
            </div>
        </div>
        <h1 class="font-fredoka text-2xl md:text-4xl font-bold text-sky-600 tracking-wide">
            CVC Vowel Picture Explorer 🔤
        </h1>
        <p class="text-xs md:text-sm text-slate-500 font-medium">
            Change the vowel to see if it makes a REAL word with a picture!
        </p>
    </header>

    <!-- Main Card Display -->
    <main class="w-full max-w-2xl bg-white rounded-3xl p-5 md:p-6 shadow-xl border-4 border-sky-200 flex flex-col items-center relative">
        
        <!-- Top Controls / Progress -->
        <div class="w-full flex items-center justify-between mb-3">
            <button id="prevBtn" onclick="changeWord(-1)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm md:text-base border border-slate-300 transition flex items-center gap-1 disabled:opacity-30 disabled:cursor-not-allowed">
                ⬅️ Prev
            </button>
            
            <div class="text-center">
                <span id="wordCounter" class="font-fredoka text-lg md:text-xl font-bold text-sky-600">Word 1 of 20</span>
                <div id="vowelTag" class="text-xs font-semibold text-slate-400">Base: h _ t</div>
            </div>

            <button id="nextBtn" onclick="changeWord(1)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm md:text-base border border-slate-300 transition flex items-center gap-1 disabled:opacity-30 disabled:cursor-not-allowed">
                Next ➡️
            </button>
        </div>

        <!-- Big Word & Visual Illustration Box -->
        <div class="w-full bg-gradient-to-b from-sky-50 to-blue-50 border-3 border-dashed border-sky-300 rounded-3xl p-4 md:p-6 mb-5 flex flex-col items-center justify-center relative shadow-inner min-h-[260px]">
            
            <!-- Picture Display Area -->
            <div id="pictureContainer" class="mb-3 flex flex-col items-center justify-center h-32 w-full">
                <!-- Dynamic Image or Empty Placeholder -->
            </div>

            <!-- Big Word Display Slot -->
            <div id="wordDisplay" class="font-fredoka text-5xl md:text-7xl font-bold tracking-widest text-slate-800 flex items-center justify-center gap-2 md:gap-4 select-none">
                <!-- Word letters dynamically generated here -->
            </div>

            <!-- Word Meaning & Status Box -->
            <div id="meaningBox" class="mt-3 px-4 py-1.5 rounded-full text-sm md:text-base font-bold flex items-center gap-2">
                <!-- Status & Hebrew meaning -->
            </div>
        </div>

        <!-- Vowel Selection Buttons -->
        <div class="w-full mb-5">
            <div class="text-center text-xs md:text-sm font-bold text-slate-500 mb-2 uppercase tracking-wider">
                Click a Vowel to Try It:
            </div>
            <div class="grid grid-cols-5 gap-2 md:gap-4 max-w-md mx-auto">
                <button onclick="selectVowel('a')" id="btn-a" class="vowel-btn bg-amber-400 hover:bg-amber-300 text-amber-950 font-fredoka text-3xl md:text-4xl py-3 rounded-2xl font-bold border-2 border-amber-500">
                    a
                </button>
                <button onclick="selectVowel('e')" id="btn-e" class="vowel-btn bg-rose-400 hover:bg-rose-300 text-rose-950 font-fredoka text-3xl md:text-4xl py-3 rounded-2xl font-bold border-2 border-rose-500">
                    e
                </button>
                <button onclick="selectVowel('i')" id="btn-i" class="vowel-btn bg-emerald-400 hover:bg-emerald-300 text-emerald-950 font-fredoka text-3xl md:text-4xl py-3 rounded-2xl font-bold border-2 border-emerald-500">
                    i
                </button>
                <button onclick="selectVowel('o')" id="btn-o" class="vowel-btn bg-purple-400 hover:bg-purple-300 text-purple-950 font-fredoka text-3xl md:text-4xl py-3 rounded-2xl font-bold border-2 border-purple-500">
                    o
                </button>
                <button onclick="selectVowel('u')" id="btn-u" class="vowel-btn bg-sky-400 hover:bg-sky-300 text-sky-950 font-fredoka text-3xl md:text-4xl py-3 rounded-2xl font-bold border-2 border-sky-500">
                    u
                </button>
            </div>
        </div>

        <!-- Audio & Helper Buttons -->
        <div class="w-full flex items-center justify-center gap-3">
            <button onclick="speakCurrentWord()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-6 rounded-2xl shadow-md border-b-4 border-amber-700 active:border-b-0 active:translate-y-1 transition text-base md:text-lg flex items-center justify-center gap-2">
                <span>🔊 Read Word Sound</span>
            </button>
        </div>

    </main>

    <!-- Word Grid Selector Box (Jump to any word) -->
    <footer class="w-full max-w-2xl bg-white rounded-2xl p-4 shadow-md border border-slate-200 mt-4 mb-2">
        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 text-center">
            Word Bases Navigator (Click to Jump)
        </div>
        <div id="wordGrid" class="grid grid-cols-5 sm:grid-cols-10 gap-1.5">
            <!-- 20 Word Quick-Jump Buttons -->
        </div>
    </footer>
