<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meet Emma - לימוד ומבחן - נווה</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Rubik', sans-serif; background: #f0f9ff; color: #0f172a; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        .back-nav { width: 100%; max-width: 500px; margin-bottom: 8px; }
        .back-btn { text-decoration: none; color: #0284c7; font-weight: 700; }
        
        .voice-bar { width: 100%; max-width: 500px; background: #ffffff; border: 1.5px solid #bae6fd; border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        .voice-label { font-size: 0.85rem; font-weight: 700; color: #0369a1; white-space: nowrap; }
        .voice-select { flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; font-family: 'Rubik', sans-serif; font-size: 0.85rem; color: #0f172a; direction: ltr; }

        .tab-menu { display: flex; gap: 4px; width: 100%; max-width: 500px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px 2px; border: 2px solid #bae6fd; background: #ffffff; border-radius: 12px; font-weight: 700; color: #0369a1; cursor: pointer; text-align: center; font-size: 0.85rem; }
        .tab-btn.active { background: #0284c7; color: white; border-color: #0284c7; }
        .section-panel { width: 100%; max-width: 500px; display: none; }
        .section-panel.active { display: block; }
        
        .sub-tab-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .sub-btn { flex: 1; padding: 8px; border: 2px solid #a7f3d0; background: #ffffff; border-radius: 10px; font-weight: 700; color: #047857; cursor: pointer; text-align: center; }
        .sub-btn.active { background: #10b981; color: white; border-color: #10b981; }
        
        .card-box { background: white; border-radius: 20px; padding: 25px 20px; border: 2px solid #cbd5e1; text-align: center; box-shadow: 0 6px 16px rgba(0,0,0,0.05); }
        .q-progress { font-size: 0.9rem; font-weight: 700; color: #0284c7; margin-bottom: 8px; }

        .nav-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; }
        .nav-btn { background: #e0f2fe; color: #0369a1; border: 1.5px solid #bae6fd; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; flex: 1; }

        .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .opt-btn { background: #f8fafc; border: 2px solid #cbd5e1; padding: 14px 8px; border-radius: 12px; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 1.1rem; cursor: pointer; color: #0f172a; }
        .opt-btn.correct { background: #10b981 !important; color: white !important; border-color: #10b981 !important; }
        .opt-btn.wrong { background: #ef4444 !important; color: white !important; border-color: #ef4444 !important; }
        
        .input-box { width: 90%; padding: 12px; font-size: 1.5rem; font-weight: 700; text-align: center; border: 2px solid #0284c7; border-radius: 12px; margin: 15px 0; direction: ltr; font-family: 'Fredoka', sans-serif; }
        .action-btn { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 1rem; width: 100%; }
        
        .flash-card { font-family: 'Fredoka', sans-serif; font-size: 3rem; color: #0284c7; background: #e0f2fe; border-radius: 16px; padding: 25px 10px; margin: 15px 0; cursor: pointer; }
        .word-title { font-family: 'Fredoka', sans-serif; font-size: 3rem; font-weight: 700; color: #0284c7; direction: ltr; margin-bottom: 4px; }
        .word-hebrew { font-size: 1.5rem; font-weight: 700; color: #334155; margin-bottom: 12px; }
        .word-sentence { background: #f1f5f9; padding: 10px; border-radius: 10px; font-size: 1.1rem; color: #0369a1; direction: ltr; margin-top: 10px; border-right: 4px solid #0284c7; }
    </style>
</head>
<body>
    <div class="back-nav"><a href="index.html" class="back-btn">➡️ חזרה למבחנים</a></div>
    
    <div class="voice-bar">
        <span class="voice-label">🗣️ בחירת קול:</span>
        <select id="voiceSelect" class="voice-select" onchange="setVoice()"></select>
    </div>

    <!-- MAIN 3-PART NAV MENU -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchSection('learnSection')">1. לימוד וחזרה</button>
        <button class="tab-btn" onclick="switchSection('testSection')">2. מבחן בדיקה</button>
        <button class="tab-btn" onclick="switchSection('dailySection')">3. אימון בבית</button>
    </div>

    <!-- STAGE 1: TEACHING & REVIEW HUB -->
    <div id="learnSection" class="section-panel active">
        <div class="card-box" id="learnCard"></div>
    </div>

    <!-- STAGE 2 & 3: TIERED ASSESSMENT HUB (MC & TYPING) -->
    <div id="testSection" class="section-panel">
        <div class="sub-tab-row">
            <button class="sub-btn active" onclick="switchTestMode('mc')">שלב קל: בחירת פירוש</button>
            <button class="sub-btn" onclick="switchTestMode('type')">שלב מתקדם: הקלדה</button>
        </div>
        <div class="card-box" id="quizCard"></div>
    </div>

    <!-- STAGE 4: DAILY HOME REVIEW -->
    <div id="dailySection" class="section-panel">
        <div class="card-box" style="border-color: #f59e0b; background: #fffbeb;">
            <div style="font-size: 1.2rem; font-weight: 700; color: #b45309;">⚡ אימון יומי קצר של 5 דקות!</div>
            <p style="font-weight:700; margin-top:5px; color:#475569;">לחץ על הקלף כדי לגלות את התרגום והצליל:</p>
            <div class="flash-card" id="flashCard" onclick="flipFlashCard()">a lot of</div>
            <button class="action-btn" style="background:#f59e0b;" onclick="nextFlashCard()">הקלף הבא ⬅️</button>
        </div>
    </div>

    <script>
        const vocab = [
            { en: 'a lot of', he: 'הרבה', icon: '📦', sentence: 'I have a lot of books.' },
            { en: 'goal', he: 'שער (בספורט) / מטרה', icon: '⚽', sentence: 'He scored a goal!' },
            { en: 'kick', he: 'לבעוט', icon: '🦶', sentence: 'Kick the ball.' },
            { en: 'song', he: 'שיר', icon: '🎵', sentence: 'Listen to this song.' },
            { en: 'also', he: 'גם', icon: '➕', sentence: 'I also like ice cream.' },
            { en: 'hobby', he: 'תחביב', icon: '🎨', sentence: 'My hobby is painting.' },
            { en: 'piano', he: 'פסנתר', icon: '🎹', sentence: 'She plays the piano.' },
            { en: 'subject', he: 'מקצוע לימוד', icon: '📚', sentence: 'English is my favorite subject.' },
            { en: 'far', he: 'רחוק', icon: '🏞️', sentence: 'The park is far away.' },
            { en: 'Israel', he: 'ישראל', icon: '🇮🇱', sentence: 'We live in Israel.' },
            { en: 'play', he: 'לנגן / לשחק', icon: '🎮', sentence: 'Let’s play together.' }
        ];

        let availableVoices = [];
        let selectedVoice = null;

        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
            const voiceSelect = document.getElementById('voiceSelect');
            voiceSelect.innerHTML = '';

            if (availableVoices.length === 0) {
                const option = document.createElement('option');
                option.textContent = 'ברירת מחדל של המכשיר';
                voiceSelect.appendChild(option);
                return;
            }

            let defaultFemaleIndex = 0;
            availableVoices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);

                const lowerName = voice.name.toLowerCase();
                if (lowerName.includes('female') || lowerName.includes('samantha') || lowerName.includes('zira') || lowerName.includes('victoria') || lowerName.includes('google us english')) {
                    defaultFemaleIndex = index;
                }
            });

            voiceSelect.selectedIndex = defaultFemaleIndex;
            selectedVoice = availableVoices[defaultFemaleIndex];
        }

        function setVoice() {
            const voiceSelect = document.getElementById('voiceSelect');
            selectedVoice = availableVoices[voiceSelect.value];
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function playAudio(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            if (selectedVoice) utterance.voice = selectedVoice;
            window.speechSynthesis.speak(utterance);
        }

        function switchSection(secId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(secId).classList.add('active');
            
            if(secId === 'learnSection') renderLearn();
            if(secId === 'testSection') renderTest();
            if(secId === 'dailySection') renderDaily();
        }

        /* --- STAGE 1: TEACHING RENDER --- */
        let learnIdx = 0;

        function renderLearn() {
            const container = document.getElementById('learnCard');
            const item = vocab[learnIdx];

            container.innerHTML = `
                <div class="q-progress">מילה ${learnIdx + 1} מתוך ${vocab.length}</div>
                <div style="font-size: 3.5rem; margin-bottom: 5px;">${item.icon}</div>
                <div class="word-title">${item.en}</div>
                <div class="word-hebrew">${item.he}</div>
                <button class="action-btn" style="background:#f59e0b; width:auto; padding:8px 20px; margin-bottom:12px;" onclick="playAudio('${item.en}')">🔊 השמע מילה</button>
                <div class="word-sentence">
                    <b>משפט לדוגמה:</b><br>"${item.sentence}"
                    <br><button style="background:none; border:none; color:#0284c7; cursor:pointer; font-weight:700; margin-top:5px;" onclick="playAudio('${item.sentence.replace(/'/g, "\\'")}')">🔊 השמע משפט</button>
                </div>
                <div class="nav-row">
                    <button class="nav-btn" onclick="prevLearn()" ${learnIdx === 0 ? 'disabled' : ''}>➡️ הקודם</button>
                    <button class="nav-btn" onclick="nextLearn()">${learnIdx === vocab.length - 1 ? 'סיום חזרה ✨' : 'הבא ⬅️'}</button>
                </div>
            `;
            playAudio(item.en);
        }

        function nextLearn() {
            if (learnIdx < vocab.length - 1) {
                learnIdx++;
                renderLearn();
            } else {
                switchSection('testSection');
            }
        }

        function prevLearn() {
            if (learnIdx > 0) {
                learnIdx--;
                renderLearn();
            }
        }

        /* --- STAGE 2 & 3: TESTING RENDER --- */
        let testMode = 'mc';
        let qIdx = 0;

        function switchTestMode(m) {
            testMode = m;
            qIdx = 0;
            document.querySelectorAll('.sub-btn').forEach((b, i) => {
                b.classList.toggle('active', (i === 0 && m === 'mc') || (i === 1 && m === 'type'));
            });
            renderTest();
        }

        function renderTest() {
            const container = document.getElementById('quizCard');
            const item = vocab[qIdx];

            if (testMode === 'mc') {
                const choices = [item.he];
                while (choices.length < 4) {
                    const rand = vocab[Math.floor(Math.random() * vocab.length)].he;
                    if (!choices.includes(rand)) choices.push(rand);
                }
                choices.sort(() => Math.random() - 0.5);

                container.innerHTML = `
                    <div class="q-progress">שאלה ${qIdx + 1} מתוך ${vocab.length}</div>
                    <div style="font-family:'Fredoka', sans-serif; font-size:3.2rem; font-weight:700; color:#0284c7; direction:ltr; margin-bottom:5px;">${item.en}</div>
                    <button class="action-btn" style="background:#f59e0b; width:auto; padding:8px 16px; margin-bottom:15px;" onclick="playAudio('${item.en}')">🔊 השמע מילה</button>
                    <div class="opt-grid">
                        ${choices.map(c => `<button class="opt-btn" onclick="checkChoice(this, '${c}', '${item.he}', '${item.en}')">${c}</button>`).join('')}
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="q-progress">שאלה ${qIdx + 1} מתוך ${vocab.length}</div>
                    <div style="font-size:1.3rem; font-weight:700; color:#0369a1; margin-bottom:5px;">כתוב את המילה באנגלית עבור:</div>
                    <div style="font-size:1.8rem; font-weight:700; color:#334155; margin-bottom:10px;">${item.he}</div>
                    <button class="action-btn" style="background:#f59e0b; width:auto; padding:8px 16px; margin-bottom:10px;" onclick="playAudio('${item.en}')">🔊 השמע רמז קולי</button>
                    <br>
                    <input type="text" id="typeInput" class="input-box" placeholder="כתוב באנגלית..." autofocus />
                    <button class="action-btn" onclick="checkType('${item.en}')">בדוק תשובה ✨</button>
                `;
            }
        }

        function checkChoice(btn, selected, correct, fullWord) {
            if (selected === correct) {
                btn.classList.add('correct');
                playAudio(fullWord);
                confetti({ particleCount: 30, spread: 50 });
                setTimeout(nextQuestion, 1000);
            } else {
                btn.classList.add('wrong');
            }
        }

        function checkType(correct) {
            const input = document.getElementById('typeInput').value.trim().toLowerCase();
            if (input === correct.toLowerCase()) {
                playAudio(correct);
                confetti({ particleCount: 30, spread: 50 });
                setTimeout(nextQuestion, 1000);
            } else {
                alert('נסה שוב! המילה הנכונה היא: ' + correct);
            }
        }

        function nextQuestion() {
            qIdx = (qIdx + 1) % vocab.length;
            renderTest();
        }

        /* --- STAGE 4: DAILY DRILL RENDER --- */
        let dailyIdx = 0;
        let isFlipped = false;

        function renderDaily() {
            isFlipped = false;
            const el = document.getElementById('flashCard');
            el.textContent = vocab[dailyIdx].en;
            el.style.background = '#e0f2fe';
            el.style.color = '#0284c7';
            playAudio(vocab[dailyIdx].en);
        }

        function flipFlashCard() {
            const el = document.getElementById('flashCard');
            if (!isFlipped) {
                el.textContent = vocab[dailyIdx].he;
                el.style.background = '#fef3c7';
                el.style.color = '#b45309';
            } else {
                el.textContent = vocab[dailyIdx].en;
                el.style.background = '#e0f2fe';
                el.style.color = '#0284c7';
                playAudio(vocab[dailyIdx].en);
            }
            isFlipped = !isFlipped;
        }

        function nextFlashCard() {
            dailyIdx = (dailyIdx + 1) % vocab.length;
            renderDaily();
        }

        loadVoices();
        renderLearn();
    </script>
</body>
</html>
